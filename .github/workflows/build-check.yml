name: Build and render check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Build the static site
        run: npm run build

      - name: Check the build fits Cloudflare Pages limits
        run: |
          files=$(find dist -type f | wc -l)
          biggest=$(find dist -type f -printf '%s\n' | sort -rn | head -1)
          echo "dist: $files files, largest $biggest bytes"
          test "$files" -lt 20000 || { echo "too many files for Cloudflare Pages"; exit 1; }
          test "$biggest" -lt 26214400 || { echo "a file is over the 25 MiB limit"; exit 1; }

      - name: Every design still parses and has what the engine needs
        run: node tests/templates.mjs

  render:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # The CI browser ships without H.264/AAC, so this exercises the fallback
      # path and the muxing. A real Android phone is still the only place the
      # WhatsApp-facing H.264 encode can be confirmed.
      - name: Render an invite and check the file
        run: node tests/render-mp4.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rendered-invite
          path: tests/output/
          retention-days: 7
