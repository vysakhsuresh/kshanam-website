<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <title>Invita render harness</title>
  <style>body{font:15px/1.5 system-ui;margin:24px}canvas{width:240px;border:1px solid #ddd}pre{background:#f6f4f2;padding:12px}</style>
</head>
<body>
  <h1>Render harness</h1>
  <p>Not part of the site. The automated tests drive this page so the real
     worker pipeline can be exercised in a browser.</p>
  <canvas id="preview" width="720" height="1280"></canvas>
  <pre id="log">idle</pre>

  <script type="module">
    import { TEMPLATES, byId, defaultValuesFor } from './src/templates/index.js';
    import { ensureFonts, loadFonts, verifyFonts } from './src/engine/fonts.js';
    import { prepare, renderFrame, templateFamilies } from './src/engine/render.js';
    import { toValues } from './src/values.js';

    const BASE = import.meta.env.BASE_URL;
    const log = (m) => { document.getElementById('log').textContent = m; };
    const makeWorker = () => new Worker(new URL('./src/engine/worker.js', import.meta.url), { type: 'module' });

    window.designs = () => TEMPLATES.map((t) => t.id);
    const pick = (id) => byId(id) || TEMPLATES[0];

    window.capabilities = () => new Promise((resolve, reject) => {
      const w = makeWorker();
      w.onmessage = (e) => {
        if (e.data.type === 'capabilities') { resolve(e.data.caps); w.terminate(); }
        else if (e.data.type === 'error') { reject(new Error(e.data.message)); w.terminate(); }
      };
      w.onerror = (e) => reject(new Error(e.message));
      w.postMessage({ type: 'capabilities', id: 1, size: { width: 720, height: 1280 } });
    });

    window.checkFonts = async (families) => {
      await loadFonts(BASE);
      return verifyFonts(document.getElementById('preview').getContext('2d'), families);
    };

    /** Draw one frame on the main thread, for stills and screenshots. */
    window.drawFrame = async (t, opts = {}) => {
      const template = pick(opts.id);
      await ensureFonts(templateFamilies(template), BASE);
      const canvas = document.getElementById('preview');
      const prepared = prepare(template, { photos: [] });
      const entered = { ...defaultValuesFor(template), ...(opts.entered || {}) };
      renderFrame(canvas.getContext('2d', { alpha: false }), prepared, toValues(entered), t);
      return { duration: prepared.duration, scenes: prepared.scenes.map((s) => ({ id: s.id, start: s.start, duration: s.duration })) };
    };

    /** Full render through the worker. Returns the MP4 as base64. */
    window.renderViaWorker = (opts = {}) => new Promise((resolve, reject) => {
      const template = pick(opts.id);
      const w = makeWorker();
      const started = performance.now();

      w.onmessage = async (e) => {
        const d = e.data;
        if (d.type === 'progress') {
          log(`${d.phase}: ${Math.round((d.progress || 0) * 100)}%`);
          window.__lastProgress = d;
        } else if (d.type === 'done') {
          w.terminate();
          const blob = new Blob([d.result.buffer], { type: 'video/mp4' });
          const base64 = await new Promise((res) => {
            const fr = new FileReader();
            fr.onload = () => res(String(fr.result).split(',')[1]);
            fr.readAsDataURL(blob);
          });
          log(`done, ${(blob.size / 1024).toFixed(0)} KB`);
          resolve({ base64, bytes: blob.size, codecs: d.result.codecs,
                    duration: d.result.duration, frames: d.result.frames, ms: d.result.ms,
                    wallMs: Math.round(performance.now() - started) });
        } else if (d.type === 'error') { w.terminate(); reject(new Error(d.message)); }
        else if (d.type === 'cancelled') { w.terminate(); reject(new Error('cancelled')); }
      };
      w.onerror = (e) => { w.terminate(); reject(new Error(e.message || 'worker failed')); };

      w.postMessage({
        type: 'render',
        template,
        values: toValues({ ...defaultValuesFor(template), ...(opts.entered || {}) }),
        fps: opts.fps || 30,
        music: opts.music || 'music-box',
        baseUrl: BASE,
        width: 720, height: 1280,
      });
    });

    window.__harnessReady = true;
    log('ready');
  </script>
</body>
</html>
